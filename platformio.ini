[platformio]
src_dir = yoRadio
data_dir = yoRadio/data
; Product default: ESP32-S3 N16R8 (16 MB flash + 8 MB OPI PSRAM).
default_envs = stream-one-n16r8

; Shared Arduino / monitor settings for both board variants.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain
; DWIN fork: skip TFT widget stack (needs displayCustom / DspCore).
build_src_filter =
  +<*>
  -<src/displays/widgets/>
  -<src/displays/tools/utf8Rus.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=0

; -----------------------------------------------------------------------------
; Stream One release / primary hardware: ESP32-S3 N16R8
; 16 MB flash + 8 MB octal (OPI) PSRAM → ~300 KB audio input buffer.
; -----------------------------------------------------------------------------
[env:stream-one-n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DSTREAM_ONE_BOARD=N16R8

; -----------------------------------------------------------------------------
; Dev / lab boards without PSRAM (e.g. ESP32-S3 N8).
; Firmware runs; audio buffer stays small (~11 KB) — AAC/HLS less stable.
; -----------------------------------------------------------------------------
[env:dev-n8]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DSTREAM_ONE_BOARD=N8
  -DSTREAM_ONE_NO_PSRAM=1
