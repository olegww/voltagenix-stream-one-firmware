[platformio]
src_dir = yoRadio
data_dir = yoRadio/data

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_ldf_mode = chain

; ESP32-S3: 8 MB flash, no PSRAM. Hardware-specific audio, SD and control pins
; are set in yoRadio/myoptions.h.
